<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060709">
    <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../assets/css/common.css">
    <title>Lat Pull Down Tracker — AI Fitness Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

</head>
<body class="lab">
    <div class="lab__panel">
        <a href="../dashboard.html" class="lab__back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg><span class="lab__back-label">Back to Dashboard</span></a>
        
        <h1 class="lab__title">Lat Pull Down</h1>

        <div class="rep-counter" role="status" aria-live="polite" aria-atomic="true">
            <div class="rep-counter__label">REPS</div>
            <div class="rep-counter__value" id="repCount">0</div>
        </div>

        <div class="instruction-panel" role="status" aria-live="polite">
            <div class="instruction-text" id="instruction">Click Start to begin</div>
        </div>

        <div class="progress-indicator" id="progress" role="status" aria-live="polite">Pull bar down to chest level</div>

        <div class="lab__controls">
            <button type="button" id="startButton" class="btn btn--primary btn--block" onclick="startCamera()">Start</button>
            <button type="button" id="stopButton" class="btn btn--ghost btn--block" onclick="stopCamera()" disabled>Stop</button>
            <button type="button" id="switchCameraButton" class="btn btn--secondary btn--block" onclick="switchCamera()">Flip Camera</button>
            <button type="button" id="toggleSkeletonButton" class="btn btn--secondary btn--block" onclick="toggleSkeleton()">Hide Skeleton</button>
        </div>
    </div>

    <div class="lab__stage">
        <div class="camera-container">
            <video id="input_video" autoplay playsinline muted aria-label="Live camera feed used for pose tracking"></video>
            <canvas id="output_canvas"></canvas>
            <div class="rep-progress-bar-container">
                <div class="rep-progress-bar-fill" id="repProgressBar"></div>
            </div>
        </div>
    </div>

    <script type="module">
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const repCountElement = document.getElementById('repCount');
        const instructionElement = document.getElementById('instruction');
        const progressElement = document.getElementById('progress');
        const startButton = document.getElementById('startButton');
        const stopButton = document.getElementById('stopButton');

        let currentFacingMode = 'user';

        let showSkeleton = true;
        window.toggleSkeleton = function() {
            showSkeleton = !showSkeleton;
            const btn = document.getElementById('toggleSkeletonButton');
            if (btn) btn.textContent = showSkeleton ? "Show Skeleton" : "Hide Skeleton";
        };

        function updateMirror() {
            if (currentFacingMode === 'user') {
                videoElement.style.transform = 'scaleX(-1)';
                canvasElement.style.transform = 'scaleX(-1)';
            } else {
                videoElement.style.transform = 'scaleX(1)';
                canvasElement.style.transform = 'scaleX(1)';
            }
        }

        window.switchCamera = async function() {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            if (camera) {
                camera.stop();
                camera = null;
            }
            updateMirror();
            if (!pose) initializePose();
            const container = document.querySelector('.camera-container');
            camera = new Camera(videoElement, {
                onFrame: async () => { await pose.send({ image: videoElement }); },
                width: container.clientWidth || 640,
                height: container.clientHeight || 480,
                facingMode: currentFacingMode
            });
            await camera.start();
            startButton.disabled = true;
            stopButton.disabled = false;
            updateUI();
        }

        // Initialize variables
        let counter = 0;
        let stage = null; // 'up' (extended) or 'down' (pulled)
        let currentProgress = 0;
        let leftWristYHistory = [];
        let rightWristYHistory = [];
        const maxHistoryLength = 5;
        const visibilityThreshold = 0.5;

        let pose = null;
        let camera = null;

        // Check landmark visibility
        function checkLandmarkVisibility(landmarks, indices) {
            for (let idx of indices) {
                if (landmarks[idx].visibility < visibilityThreshold) {
                    return false;
                }
            }
            return true;
        }

        // Smooth Y position using moving average
        function smoothY(y, history) {
            history.push(y);
            if (history.length > maxHistoryLength) {
                history.shift();
            }
            const sum = history.reduce((a, b) => a + b, 0);
            return sum / history.length;
        }

        // Update UI
        function updateUI() {
            repCountElement.textContent = counter;
            
            const progressBar = document.getElementById('repProgressBar');
            if (progressBar) {
                progressBar.style.height = `${currentProgress}%`;
            }

            let instructionText = '';
            let instructionClass = '';

            if (!pose || !camera) {
                instructionText = 'Click Start to begin';
                instructionClass = 'waiting';
            } else {
                if (stage === 'up') {
                    instructionText = 'PULL BAR DOWN TO CHEST';
                    instructionClass = 'action';
                } else if (stage === 'down') {
                    instructionText = 'EXTEND ARMS BACK UP';
                    instructionClass = 'waiting';
                } else {
                    instructionText = 'START: EXTEND ARMS UP';
                    instructionClass = 'waiting';
                }
            }

            instructionElement.textContent = instructionText;
            instructionElement.className = 'instruction-text ' + instructionClass;
        }

        // Process pose results
        function onResults(results) {
            if (!camera) return; // late frame from a stopped session
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                const landmarks = results.poseLandmarks;
                const h = canvasElement.height;
                const w = canvasElement.width;

                // Process both arms for lat pull down
                const leftHipIdx = 23;
                const rightHipIdx = 24;
                const leftShoulderIdx = 11;
                const leftWristIdx = 15;
                const rightShoulderIdx = 12;
                const rightWristIdx = 16;

                const leftArmVisible = checkLandmarkVisibility(
                    landmarks,
                    [leftShoulderIdx, leftWristIdx]
                );
                const rightArmVisible = checkLandmarkVisibility(
                    landmarks,
                    [rightShoulderIdx, rightWristIdx]
                );

                if (leftArmVisible && rightArmVisible) {
                    const leftShoulderY = landmarks[leftShoulderIdx].y;
                    const leftWristY = landmarks[leftWristIdx].y;
                    const rightShoulderY = landmarks[rightShoulderIdx].y;
                    const rightWristY = landmarks[rightWristIdx].y;

                    const leftSmoothedWristY = smoothY(leftWristY, leftWristYHistory);
                    const rightSmoothedWristY = smoothY(rightWristY, rightWristYHistory);
                    const avgWristY = (leftSmoothedWristY + rightSmoothedWristY) / 2;
                    const avgShoulderY = (leftShoulderY + rightShoulderY) / 2;

                    // Calculate relative position (positive = wrist below shoulder, negative = wrist above shoulder)
                    const relativePosition = avgWristY - avgShoulderY;

                    // Display position info
                    if (showSkeleton) {
                        const leftWristX = landmarks[leftWristIdx].x * w;
                        const leftWristYPixel = landmarks[leftWristIdx].y * h;
                        const rightWristX = landmarks[rightWristIdx].x * w;
                        const rightWristYPixel = landmarks[rightWristIdx].y * h;
                        
                        canvasCtx.fillStyle = '#5CD3F5';
                        canvasCtx.font = '600 18px "JetBrains Mono", monospace';
                        const positionText = relativePosition > 0.05 ? 'DOWN' : 'UP';
                        canvasCtx.fillText(positionText, leftWristX - 30, leftWristYPixel - 20);
                        canvasCtx.fillText(positionText, rightWristX - 30, rightWristYPixel - 20);
                    }

                    let percentage = (relativePosition + 0.05) / 0.1 * 100;
                    currentProgress = Math.max(0, Math.min(100, percentage));

                    // Lat pull down logic:
                    // Up position: wrist above shoulder (relativePosition < -0.05)
                    // Down position: wrist below shoulder (relativePosition > 0.05)
                    if (relativePosition < -0.05) {
                        stage = 'up';
                    } else if (relativePosition > 0.05 && stage === 'up') {
                        stage = 'down';
                        counter++;
                        window.dispatchEvent(new CustomEvent('repCompleted', { detail: { count: counter } }));
                        console.log(`Rep Count: ${counter}`);
                    }
                } else {
                    stage = null;
                }

                // Draw pose landmarks and connections
                if (showSkeleton) {
                    drawConnectors(canvasCtx, landmarks, POSE_CONNECTIONS, {color: '#D7FF3A', lineWidth: 4});
                    drawLandmarks(canvasCtx, landmarks, {color: '#5CD3F5', lineWidth: 2, radius: 4});
                }
                
                // Torso upright check
                let isWrongForm = false;
                const leftTorsoVisible = checkLandmarkVisibility(landmarks, [leftShoulderIdx, leftHipIdx]);
                const rightTorsoVisible = checkLandmarkVisibility(landmarks, [rightShoulderIdx, rightHipIdx]);

                if (leftTorsoVisible || rightTorsoVisible) {
                    let maxTorsoLean = 0;
                    if (leftTorsoVisible) {
                        const dx = landmarks[leftHipIdx].x - landmarks[leftShoulderIdx].x;
                        const dy = landmarks[leftHipIdx].y - landmarks[leftShoulderIdx].y;
                        const lean = Math.abs(Math.atan2(dx, dy) * 180 / Math.PI);
                        maxTorsoLean = Math.max(maxTorsoLean, lean);
                    }
                    if (rightTorsoVisible) {
                        const dx = landmarks[rightHipIdx].x - landmarks[rightShoulderIdx].x;
                        const dy = landmarks[rightHipIdx].y - landmarks[rightShoulderIdx].y;
                        const lean = Math.abs(Math.atan2(dx, dy) * 180 / Math.PI);
                        maxTorsoLean = Math.max(maxTorsoLean, lean);
                    }
                    
                    if (maxTorsoLean > 20) {
                        isWrongForm = true;
                    }
                }
                
                if (isWrongForm) {
                    document.querySelector('.camera-container').classList.add('wrong-form');
                } else {
                    document.querySelector('.camera-container').classList.remove('wrong-form');
                }
            } else {
                stage = null;
                document.querySelector('.camera-container').classList.remove('wrong-form');
            }

            canvasCtx.restore();
            updateUI();
        }

        // Initialize MediaPipe Pose
        function initializePose() {
            pose = new Pose({
                locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
                }
            });

            pose.setOptions({
                modelComplexity: 1,
                smoothLandmarks: true,
                enableSegmentation: false,
                smoothSegmentation: false,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.7
            });

            pose.onResults(onResults);
        }

        // Start camera
        window.startCamera = function() {
            if (camera) {
                return;
            }

            // Reuse one Pose instance: MediaPipe cannot be re-created after close(),
            // so a new one would never return results. reset() clears the last set.
            if (pose) pose.reset();
            else initializePose();

            const container = document.querySelector('.camera-container');
            camera = new Camera(videoElement, {
                onFrame: async () => { await pose.send({ image: videoElement }); },
                width: container.clientWidth || 640,
                height: container.clientHeight || 480,
                facingMode: currentFacingMode
            });

            camera.start();
            updateMirror();
            startButton.disabled = true;
            stopButton.disabled = false;
            updateUI();
        };

        // Stop camera
        window.stopCamera = function () {
            if (camera) {
                camera.stop();
                camera = null;
            }
            
            counter = 0;
            stage = null;
            currentProgress = 0;
            leftWristYHistory = [];
            rightWristYHistory = [];
            
            document.querySelector('.camera-container').classList.remove('wrong-form');
            
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            videoElement.srcObject = null;
            
            startButton.disabled = false;
            stopButton.disabled = true;
            updateUI();
        };

        // Set canvas size
        function setupCanvas() {
            const updateCanvasSize = () => {
                const panel = document.querySelector('.camera-container');
                if (panel) {
                    canvasElement.width = panel.clientWidth;
                    canvasElement.height = panel.clientHeight;
                }
            };
            
            updateCanvasSize();
            window.addEventListener('resize', updateCanvasSize);
        }

        // Initialize
        setupCanvas();
        updateUI();

        // Handle page visibility change
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && camera) {
                window.stopCamera();
            }
        });
    </script>
    <script src="../assets/js/routine.js"></script>
</body>
</html>
