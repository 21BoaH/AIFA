<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060709">
    <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <title>Deadlift Tracker — AI Fitness Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>

<body class="lab">
    <div class="lab__panel">
        <a href="../dashboard.html" class="lab__back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg><span class="lab__back-label">Back to Dashboard</span></a>

        <h1 class="lab__title">Deadlifts</h1>

        <div class="rep-counter" role="status" aria-live="polite" aria-atomic="true">
            <div class="rep-counter__label">REPS</div>
            <div class="rep-counter__value" id="repCount">0</div>
        </div>

        <div class="instruction-panel" role="status" aria-live="polite">
            <div class="instruction-text" id="instruction">Click Start to begin</div>
        </div>

        <div class="progress-indicator" id="progress" role="status" aria-live="polite">Side-on to the camera · full body in frame · stand tall at Start</div>

        <div class="lab__controls">
            <button type="button" id="startButton" class="btn btn--primary btn--block" onclick="startCamera()">Start</button>
            <button type="button" id="stopButton" class="btn btn--ghost btn--block" onclick="stopCamera()" disabled>Stop</button>
            <button type="button" id="switchCameraButton" class="btn btn--secondary btn--block" onclick="switchCamera()">Flip Camera</button>
            <button type="button" id="toggleSkeletonButton" class="btn btn--secondary btn--block" onclick="toggleSkeleton()">Hide Skeleton</button>
        </div>
    </div>

    <div class="lab__stage">
        <div class="camera-container">
            <video id="input_video" autoplay playsinline muted aria-label="Live camera feed used for pose tracking"></video>
            <canvas id="output_canvas"></canvas>
            <div class="rep-progress-bar-container" aria-hidden="true">
                <div class="rep-progress-bar-fill" id="repProgressBar"></div>
            </div>
        </div>
    </div>

    <script type="module">
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const repCountElement = document.getElementById('repCount');
        const instructionElement = document.getElementById('instruction');
        const progressElement = document.getElementById('progress');
        const startButton = document.getElementById('startButton');
        const stopButton = document.getElementById('stopButton');

        let currentFacingMode = 'user';

        let showSkeleton = true;
        window.toggleSkeleton = function () {
            showSkeleton = !showSkeleton;
            const btn = document.getElementById('toggleSkeletonButton');
            if (btn) btn.textContent = showSkeleton ? "Hide Skeleton" : "Show Skeleton";
        };

        function updateMirror() {
            if (currentFacingMode === 'user') {
                videoElement.style.transform = 'scaleX(-1)';
                canvasElement.style.transform = 'scaleX(-1)';
            } else {
                videoElement.style.transform = 'scaleX(1)';
                canvasElement.style.transform = 'scaleX(1)';
            }
        }

        window.switchCamera = async function () {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            if (camera) {
                camera.stop();
                camera = null;
            }
            updateMirror();
            if (!pose) initializePose();
            const container = document.querySelector('.camera-container');
            camera = new Camera(videoElement, {
                onFrame: async () => { await pose.send({ image: videoElement }); },
                width: container.clientWidth || 640,
                height: container.clientHeight || 480,
                facingMode: currentFacingMode
            });
            await camera.start();
            startButton.disabled = true;
            stopButton.disabled = false;
            updateUI();
        }

        // Initialize variables
        let counter = 0;
        let stage = null; // 'down' or 'up'
        let currentProgress = 0;
        let formWarning = null;
        let positionCue = null;
        let histories = {};
        const maxHistoryLength = 5;
        const SMOOTHING_WINDOW_MS = 160;
        const visibilityThreshold = 0.5;

        let pose = null;
        let camera = null;

        // Calculate angle between three points
        function calculateAngle(a, b, c) {
            // Landmark x and y are fractions of the frame's width and height. Rescale x by the
            // video's aspect ratio so angles are measured in true proportions on any camera.
            const aspect = (videoElement.videoWidth / videoElement.videoHeight) || 1;
            const radians = Math.atan2(c[1] - b[1], (c[0] - b[0]) * aspect) -
                Math.atan2(a[1] - b[1], (a[0] - b[0]) * aspect);
            let angle = Math.abs(radians * 180.0 / Math.PI);

            if (angle > 180.0) {
                angle = 360 - angle;
            }

            return angle;
        }

        // Check landmark visibility
        function checkLandmarkVisibility(landmarks, indices) {
            for (let idx of indices) {
                if (landmarks[idx].visibility < visibilityThreshold) {
                    return false;
                }
            }
            return true;
        }

        // Smooth angle using moving average
        function smoothAngle(value, history) {
            // Average the readings from the last ~160 ms (at most maxHistoryLength frames), so the
            // smoothing lag stays small on slower devices instead of growing with frame time.
            const now = performance.now();
            history.push({ t: now, v: value });
            while (history.length > maxHistoryLength ||
                   (history.length > 1 && now - history[0].t > SMOOTHING_WINDOW_MS)) {
                history.shift();
            }
            return history.reduce((sum, sample) => sum + sample.v, 0) / history.length;
        }

        // The skeleton is the only thing drawn over the video; it turns red while a form check fails
        function skeletonColor() {
            return document.querySelector('.camera-container').classList.contains('wrong-form') ? '#FF5C5C' : '#D7FF3A';
        }

        // ---- Body measurements ----
        // Landmark indices for each side of the body
        const LEFT = { name: 'left', ear: 7, shoulder: 11, elbow: 13, wrist: 15, hip: 23, knee: 25, ankle: 27, heel: 29, toe: 31 };
        const RIGHT = { name: 'right', ear: 8, shoulder: 12, elbow: 14, wrist: 16, hip: 24, knee: 26, ankle: 28, heel: 30, toe: 32 };

        function point(landmarks, idx) {
            return [landmarks[idx].x, landmarks[idx].y];
        }

        function clamp(value) {
            return Math.max(0, Math.min(100, value));
        }

        // The sides on which every listed joint is visible, clearest first
        function visibleSides(landmarks, joints) {
            return [LEFT, RIGHT]
                .filter(side => checkLandmarkVisibility(landmarks, joints.map(joint => side[joint])))
                .map(side => ({ side, score: joints.reduce((sum, joint) => sum + landmarks[side[joint]].visibility, 0) }))
                .sort((a, b) => b.score - a.score);
        }

        // The angle at joint b on one side
        function jointAngle(landmarks, side, a, b, c) {
            return calculateAngle(point(landmarks, side[a]), point(landmarks, side[b]), point(landmarks, side[c]));
        }

        // Smoothed reading, with its own history per measurement
        function smooth(key, value) {
            if (!histories[key]) histories[key] = [];
            return smoothAngle(value, histories[key]);
        }

        // Smoothed angle from the sides the camera can see: the two sides are averaged when they are
        // seen about equally well, otherwise the clearer side is trusted on its own
        function readAngle(landmarks, sides, a, b, c) {
            const used = sides.length > 1 && sides[0].score - sides[1].score < 0.3 ? sides : sides.slice(0, 1);
            const values = used.map(entry => smooth(`${a}-${b}-${c}-${entry.side.name}`, jointAngle(landmarks, entry.side, a, b, c)));
            return values.reduce((sum, value) => sum + value, 0) / values.length;
        }

        // Angle of the hip-to-shoulder line from vertical, in true proportions: 0 standing tall, 90 lying flat
        function torsoTilt(landmarks, side) {
            const aspect = (videoElement.videoWidth / videoElement.videoHeight) || 1;
            const dx = (landmarks[side.shoulder].x - landmarks[side.hip].x) * aspect;
            const dy = landmarks[side.shoulder].y - landmarks[side.hip].y;
            return Math.abs(Math.atan2(dx, -dy) * 180 / Math.PI);
        }

        // Torso tilt on the clearest side, or null when the shoulders and hips can't be seen
        function readTilt(landmarks) {
            const sides = visibleSides(landmarks, ['shoulder', 'hip']);
            return sides.length ? torsoTilt(landmarks, sides[0].side) : null;
        }

        // Red skeleton and an error cue while a form check fails
        function setFormWarning(message) {
            formWarning = message;
            document.querySelector('.camera-container').classList.toggle('wrong-form', !!message);
        }

        // How far the head and upper back curl down below the line of the torso, in degrees, on the clearest
        // side. A rounding back drops the ear below the hip-to-shoulder line; looking ahead lifts it above,
        // which doesn't count. Null while upright (there is no "down" to round towards) or out of view.
        function backRounding(landmarks) {
            const sides = visibleSides(landmarks, ['ear', 'shoulder', 'hip']);
            if (!sides.length) return null;
            const side = sides[0].side;
            if (torsoTilt(landmarks, side) < 30) return null;
            const aspect = (videoElement.videoWidth / videoElement.videoHeight) || 1;
            const vx = (landmarks[side.shoulder].x - landmarks[side.hip].x) * aspect;
            const vy = landmarks[side.shoulder].y - landmarks[side.hip].y;
            const wx = (landmarks[side.ear].x - landmarks[side.shoulder].x) * aspect;
            const wy = landmarks[side.ear].y - landmarks[side.shoulder].y;
            // Elevation of the torso and of the neck, both measured in the direction the torso points
            const facing = Math.sign(vx) || 1;
            const torso = Math.atan2(-vy, vx * facing);
            const neck = Math.atan2(-wy, wx * facing);
            return smooth('back-rounding', (torso - neck) * 180 / Math.PI);
        }

        // ---- Spine points ----
        // The pose model has no landmarks on the spine, but seen from the side the outline of the back runs
        // along it. The segmentation mask (the body's silhouette) gives that outline: from three points on the
        // hip-to-shoulder line, step out towards the back until the silhouette ends. The three edge points sit
        // on the lower, middle and upper back.
        const MASK_HEIGHT = 360;           // silhouette resolution for the search, in pixels per frame height
        const SPINE_READ_MS = 120;         // read the silhouette about 8 times a second; it costs a GPU readback
        const SPINE_ROUNDING_LIMIT = 20;   // degrees of extra rounding, beyond your standing posture, that are allowed
        const maskCanvas = document.createElement('canvas');
        const maskCtx = maskCanvas.getContext('2d', { willReadFrequently: true });
        let spine = null;                  // { depths, facing }: the back's distance from the hip-shoulder line
        let spineReadAt = 0;
        let spineBaseline = null;          // your back's natural curve, measured while standing tall
        let spineSamples = [];

        // Which way the person faces along x: +1 or -1, or 0 if it can't be told
        function facingDirection(landmarks, side, torsoDx, tilt) {
            if (tilt > 20) return Math.sign(torsoDx);                // leaning: the shoulders lead
            const [heel, toe] = [landmarks[side.heel], landmarks[side.toe]];
            if (heel.visibility >= visibilityThreshold && toe.visibility >= visibilityThreshold && Math.abs(toe.x - heel.x) > 0.01) {
                return Math.sign(toe.x - heel.x);                     // standing: the toes point forward
            }
            const [nose, ear] = [landmarks[0], landmarks[side.ear]];
            if (nose.visibility >= visibilityThreshold && ear.visibility >= visibilityThreshold && Math.abs(nose.x - ear.x) > 0.005) {
                return Math.sign(nose.x - ear.x);
            }
            return 0;
        }

        // Shortest distance from point p to the segment a-b
        function distanceToSegment(p, a, b) {
            const [dx, dy] = [b[0] - a[0], b[1] - a[1]];
            const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
            return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy);
        }

        // The hip-shoulder line on the clearest side, in true proportions (x scaled by the aspect ratio)
        function torsoLine(landmarks) {
            const sides = visibleSides(landmarks, ['shoulder', 'hip']);
            if (!sides.length) return null;
            const side = sides[0].side;
            const aspect = (videoElement.videoWidth / videoElement.videoHeight) || 1;
            const hip = [landmarks[side.hip].x * aspect, landmarks[side.hip].y];
            const u = [landmarks[side.shoulder].x * aspect - hip[0], landmarks[side.shoulder].y - hip[1]];
            const len = Math.hypot(u[0], u[1]);
            return len < 0.05 ? null : { side, aspect, hip, u, len, tilt: Math.abs(Math.atan2(u[0], -u[1]) * 180 / Math.PI) };
        }

        // Where the back's outline sits at 25%, 50% and 75% of the way from hip to shoulder, as distances from
        // the hip-shoulder line in torso lengths; null when it can't be read (no mask, the person facing the
        // camera, or an arm in the way)
        function readSpine(landmarks, mask) {
            if (!mask || !mask.width) return null;
            const torso = torsoLine(landmarks);
            if (!torso) return null;
            const { side, aspect, hip, u, len, tilt } = torso;
            const facing = facingDirection(landmarks, side, u[0], tilt);
            if (!facing) return null;
            const n = facing > 0 ? [u[1] / len, -u[0] / len] : [-u[1] / len, u[0] / len];   // points to the back
            const shoulder = [hip[0] + u[0], hip[1] + u[1]];

            // Copy just the torso's part of the silhouette
            const reach = 0.7 * len;
            const x0 = Math.max(0, Math.min(hip[0], shoulder[0]) - reach), x1 = Math.min(aspect, Math.max(hip[0], shoulder[0]) + reach);
            const y0 = Math.max(0, Math.min(hip[1], shoulder[1]) - reach), y1 = Math.min(1, Math.max(hip[1], shoulder[1]) + reach);
            const w = Math.max(1, Math.round((x1 - x0) * MASK_HEIGHT)), h = Math.max(1, Math.round((y1 - y0) * MASK_HEIGHT));
            if (maskCanvas.width !== w || maskCanvas.height !== h) {
                maskCanvas.width = w;
                maskCanvas.height = h;
            } else {
                maskCtx.clearRect(0, 0, w, h);
            }
            const sx = mask.width / aspect, sy = mask.height;   // mask pixels per frame height
            maskCtx.drawImage(mask, x0 * sx, y0 * sy, (x1 - x0) * sx, (y1 - y0) * sy, 0, 0, w, h);
            const data = maskCtx.getImageData(0, 0, w, h).data;
            // Silhouette coverage at a point, 0..1, interpolated between pixels
            const coverage = (px, py) => {
                const x = (px - x0) * MASK_HEIGHT - 0.5, y = (py - y0) * MASK_HEIGHT - 0.5;
                if (x < 0 || y < 0 || x > w - 1 || y > h - 1) return 0;
                const xa = Math.floor(x), ya = Math.floor(y), xb = Math.min(xa + 1, w - 1), yb = Math.min(ya + 1, h - 1);
                const fx = x - xa, fy = y - ya;
                const a = (xx, yy) => data[(yy * w + xx) * 4 + 3];
                return ((a(xa, ya) * (1 - fx) + a(xb, ya) * fx) * (1 - fy) + (a(xa, yb) * (1 - fx) + a(xb, yb) * fx) * fy) / 255;
            };

            // From the hip-shoulder line, step out to where the silhouette ends (to within a quarter of a pixel)
            const step = 0.5 / MASK_HEIGHT;
            const edge = (t) => {
                const p = [hip[0] + u[0] * t, hip[1] + u[1] * t];
                if (coverage(p[0], p[1]) < 0.5) return null;     // the line should run inside the body
                let previous = 1;
                for (let d = step; d < reach; d += step) {
                    const value = coverage(p[0] + n[0] * d, p[1] + n[1] * d);
                    if (value < 0.5) return d - step * (0.5 - value) / (previous - value || 1);
                    previous = value;
                }
                return null;                                     // never left the body
            };
            const depths = [];
            for (const t of [0.25, 0.5, 0.75]) {
                const rays = [t - 0.04, t, t + 0.04].map(edge);  // three neighbouring rays steady the edge
                if (rays.some(d => d === null)) return null;
                depths.push((rays[0] + rays[1] + rays[2]) / 3 / len);
            }

            // An arm resting against the back (elbows back on a barbell squat, or at the top of a row) hides the
            // outline: don't guess
            const points = depths.map((d, i) => [hip[0] + u[0] * (i + 1) / 4 + n[0] * d * len, hip[1] + u[1] * (i + 1) / 4 + n[1] * d * len]);
            for (const arm of [LEFT, RIGHT]) {
                if (!checkLandmarkVisibility(landmarks, [arm.shoulder, arm.elbow])) continue;
                const s = [landmarks[arm.shoulder].x * aspect, landmarks[arm.shoulder].y];
                const e = [landmarks[arm.elbow].x * aspect, landmarks[arm.elbow].y];
                const segments = [[s, e]];
                if (landmarks[arm.wrist].visibility >= visibilityThreshold) segments.push([e, [landmarks[arm.wrist].x * aspect, landmarks[arm.wrist].y]]);
                if (points.some(p => segments.some(([a, b]) => distanceToSegment(p, a, b) < 0.12 * len))) return null;
            }
            return { depths, facing, tilt };
        }

        // The three spine points in frame coordinates, placed on this frame's hip-shoulder line so they move
        // with the skeleton between silhouette reads
        function spinePoints(landmarks) {
            const torso = spine && torsoLine(landmarks);
            if (!torso) return null;
            const { aspect, hip, u, len } = torso;
            const n = spine.facing > 0 ? [u[1] / len, -u[0] / len] : [-u[1] / len, u[0] / len];
            return spine.depths.map((d, i) => [(hip[0] + u[0] * (i + 1) / 4 + n[0] * d * len) / aspect, hip[1] + u[1] * (i + 1) / 4 + n[1] * d * len]);
        }

        // How far the middle of the back bulges past the line through the lower and upper back points, as an
        // angle: 0 for a straight back, positive when it rounds
        function spineBend(depths) {
            const [lower, middle, upper] = depths;
            const chord = Math.hypot(0.5, upper - lower);
            const offset = (middle - (lower + upper) / 2) * 0.5 / chord;   // perpendicular to the chord
            return 2 * Math.atan2(offset, chord / 2) * 180 / Math.PI;
        }

        // Extra rounding of the back compared with standing tall, in degrees. Null while upright (only a
        // hinged or squatting back is judged) or when the back can't be seen. The first moments standing
        // tall after Start record your back's natural curve.
        function spineRounding(landmarks, mask) {
            const now = performance.now();
            if (now - spineReadAt >= SPINE_READ_MS) {
                spineReadAt = now;
                spine = readSpine(landmarks, mask);
                if (spine && spineBaseline === null && spine.tilt < 15) {
                    spineSamples.push(spineBend(spine.depths));
                    if (spineSamples.length >= 8) spineBaseline = spineSamples.reduce((a, b) => a + b, 0) / spineSamples.length;
                }
            }
            if (!spine || spine.tilt < 20) return null;
            return smooth('spine-bend', spineBend(spine.depths)) - (spineBaseline !== null ? spineBaseline : 0);
        }

        // The spine points, drawn as part of the skeleton: a curve from the hip along the back to the shoulder
        function drawSpine(landmarks) {
            const points = spinePoints(landmarks);
            if (!points) return;
            const side = visibleSides(landmarks, ['shoulder', 'hip'])[0].side;
            const toCanvas = p => [p[0] * canvasElement.width, p[1] * canvasElement.height];
            const pts = points.map(toCanvas);
            const curve = [toCanvas(point(landmarks, side.hip)), ...pts, toCanvas(point(landmarks, side.shoulder))];
            canvasCtx.strokeStyle = skeletonColor();
            canvasCtx.lineWidth = 4;
            canvasCtx.beginPath();
            curve.forEach((p, i) => i ? canvasCtx.lineTo(p[0], p[1]) : canvasCtx.moveTo(p[0], p[1]));
            canvasCtx.stroke();
            canvasCtx.fillStyle = '#5CD3F5';
            pts.forEach(p => {
                canvasCtx.beginPath();
                canvasCtx.arc(p[0], p[1], 5, 0, 2 * Math.PI);
                canvasCtx.fill();
            });
        }

        // Update UI
        function updateUI() {
            repCountElement.textContent = counter;

            const progressBar = document.getElementById('repProgressBar');
            if (progressBar) {
                progressBar.style.height = `${currentProgress}%`;
            }

            let instructionText = '';
            let instructionClass = '';

            if (!pose || !camera) {
                instructionText = 'Click Start to begin';
                instructionClass = 'waiting';
            } else if (formWarning) {
                instructionText = formWarning;
                instructionClass = 'error';
            } else if (positionCue) {
                instructionText = positionCue;
                instructionClass = 'waiting';
            } else if (stage === 'down') {
                instructionText = 'STAND UP';
                instructionClass = 'action';
            } else if (stage === 'up') {
                instructionText = 'HINGE DOWN';
                instructionClass = 'waiting';
            } else {
                instructionText = 'START: HINGE DOWN';
                instructionClass = 'waiting';
            }

            instructionElement.textContent = instructionText;
            instructionElement.className = 'instruction-text ' + instructionClass;
        }

        // Process pose results
        function onResults(results) {
            if (!camera) return; // late frame from a stopped session
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            let warning = null;
            positionCue = null;
            if (results.poseLandmarks) {
                const landmarks = results.poseLandmarks;
                if (showSkeleton) {
                    drawConnectors(canvasCtx, landmarks, POSE_CONNECTIONS, { color: skeletonColor(), lineWidth: 4 });
                    drawLandmarks(canvasCtx, landmarks, { color: '#5CD3F5', lineWidth: 2, radius: 4 });
                }

                // Hip angle (shoulder–hip–knee) and knee angle (hip–knee–ankle)
                const trunk = visibleSides(landmarks, ['shoulder', 'hip', 'knee']);
                if (trunk.length > 0) {
                    const hip = readAngle(landmarks, trunk, 'shoulder', 'hip', 'knee');
                    const legs = visibleSides(landmarks, ['hip', 'knee', 'ankle']);
                    const knee = legs.length ? readAngle(landmarks, legs, 'hip', 'knee', 'ankle') : 180;
                    currentProgress = clamp((160 - hip) / (160 - 90) * 100);

                    // Deadlift logic: down at the floor (hip angle < 90), up only at full lockout:
                    // hips past 160 and knees past 155, standing tall
                    if (hip < 90) {
                        stage = 'down';
                    } else if (hip > 160 && knee > 155 && stage === 'down') {
                        stage = 'up';
                        counter++;
                        window.dispatchEvent(new CustomEvent('repCompleted', { detail: { count: counter } }));
                    }
                }

                // Back straight: the spine points mustn't round more than 20° past your standing posture. When the
                // back's outline can't be seen, the head mustn't drop more than 35° below the torso line instead.
                const rounding = spineRounding(landmarks, results.segmentationMask);
                const headDrop = rounding === null ? backRounding(landmarks) : null;
                if ((rounding !== null && rounding > SPINE_ROUNDING_LIMIT) || (headDrop !== null && headDrop > 35)) {
                    warning = 'KEEP YOUR BACK STRAIGHT';
                }
                if (showSkeleton) drawSpine(landmarks);
            }

            setFormWarning(warning);
            canvasCtx.restore();
            updateUI();
        }

        // Initialize MediaPipe Pose
        function initializePose() {
            pose = new Pose({
                locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
                }
            });

            pose.setOptions({
                modelComplexity: 1,
                smoothLandmarks: true,
                enableSegmentation: true,   // the silhouette, for the spine points
                smoothSegmentation: true,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.7
            });

            pose.onResults(onResults);
        }

        // Start camera
        window.startCamera = function () {
            if (camera) {
                return;
            }

            // Reuse one Pose instance: MediaPipe cannot be re-created after close(),
            // so a new one would never return results. reset() clears the last set.
            if (pose) pose.reset();
            else initializePose();

            const container = document.querySelector('.camera-container');
            camera = new Camera(videoElement, {
                onFrame: async () => { await pose.send({ image: videoElement }); },
                width: container.clientWidth || 640,
                height: container.clientHeight || 480,
                facingMode: currentFacingMode
            });

            camera.start();
            updateMirror();
            startButton.disabled = true;
            stopButton.disabled = false;
            updateUI();
        };

        // Stop camera
        window.stopCamera = function () {
            if (camera) {
                camera.stop();
                camera = null;
            }

            counter = 0;
            stage = null;
            currentProgress = 0;
            formWarning = null;
            positionCue = null;
            histories = {};
            spine = null;
            spineReadAt = 0;
            spineBaseline = null; // re-measure your standing posture on the next Start
            spineSamples = [];

            document.querySelector('.camera-container').classList.remove('wrong-form');

            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            videoElement.srcObject = null;

            startButton.disabled = false;
            stopButton.disabled = true;
            updateUI();
        };

        // Set canvas size
        function setupCanvas() {
            // Size the canvas to the camera frame itself. CSS scales and crops it exactly like the
            // video (both use object-fit: cover), so the skeleton lines up with the body.
            const updateCanvasSize = () => {
                if (videoElement.videoWidth) {
                    canvasElement.width = videoElement.videoWidth;
                    canvasElement.height = videoElement.videoHeight;
                } else {
                    const panel = document.querySelector('.camera-container');
                    if (panel) {
                        canvasElement.width = panel.clientWidth;
                        canvasElement.height = panel.clientHeight;
                    }
                }
            };

            updateCanvasSize();
            videoElement.addEventListener('loadedmetadata', updateCanvasSize);
            videoElement.addEventListener('resize', updateCanvasSize);
        }

        // Initialize
        setupCanvas();
        updateUI();

        // Handle page visibility change
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && camera) {
                window.stopCamera();
            }
        });
    </script>
    <script src="../assets/js/routine.js"></script>
</body>
