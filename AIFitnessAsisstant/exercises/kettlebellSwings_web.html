<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060709">
    <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <title>Kettlebell Swings Tracker — AI Fitness Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>

<body class="lab">
    <div class="lab__panel">
        <a href="../dashboard.html" class="lab__back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg><span class="lab__back-label">Back to Dashboard</span></a>

        <h1 class="lab__title">Kettlebell Swings</h1>

        <div class="rep-counter" role="status" aria-live="polite" aria-atomic="true">
            <div class="rep-counter__label">REPS</div>
            <div class="rep-counter__value" id="repCount">0</div>
        </div>

        <div class="instruction-panel" role="status" aria-live="polite">
            <div class="instruction-text" id="instruction">Click Start to begin</div>
        </div>

        <div class="progress-indicator" id="progress" role="status" aria-live="polite">Side-on to the camera · full body in frame</div>

        <div class="lab__controls">
            <button type="button" id="startButton" class="btn btn--primary btn--block" onclick="startCamera()">Start</button>
            <button type="button" id="stopButton" class="btn btn--ghost btn--block" onclick="stopCamera()" disabled>Stop</button>
            <button type="button" id="switchCameraButton" class="btn btn--secondary btn--block" onclick="switchCamera()">Flip Camera</button>
            <button type="button" id="toggleSkeletonButton" class="btn btn--secondary btn--block" onclick="toggleSkeleton()">Hide Skeleton</button>
        </div>
    </div>

    <div class="lab__stage">
        <div class="camera-container">
            <video id="input_video" autoplay playsinline muted aria-label="Live camera feed used for pose tracking"></video>
            <canvas id="output_canvas"></canvas>
            <div class="rep-progress-bar-container" aria-hidden="true">
                <div class="rep-progress-bar-fill" id="repProgressBar"></div>
            </div>
        </div>
    </div>

    <script type="module">
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const repCountElement = document.getElementById('repCount');
        const instructionElement = document.getElementById('instruction');
        const progressElement = document.getElementById('progress');
        const startButton = document.getElementById('startButton');
        const stopButton = document.getElementById('stopButton');

        let currentFacingMode = 'user';

        let showSkeleton = true;
        window.toggleSkeleton = function () {
            showSkeleton = !showSkeleton;
            const btn = document.getElementById('toggleSkeletonButton');
            if (btn) btn.textContent = showSkeleton ? "Hide Skeleton" : "Show Skeleton";
        };

        function updateMirror() {
            if (currentFacingMode === 'user') {
                videoElement.style.transform = 'scaleX(-1)';
                canvasElement.style.transform = 'scaleX(-1)';
            } else {
                videoElement.style.transform = 'scaleX(1)';
                canvasElement.style.transform = 'scaleX(1)';
            }
        }

        window.switchCamera = async function () {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            if (camera) {
                camera.stop();
                camera = null;
            }
            updateMirror();
            if (!pose) initializePose();
            const container = document.querySelector('.camera-container');
            camera = new Camera(videoElement, {
                onFrame: async () => { await pose.send({ image: videoElement }); },
                width: container.clientWidth || 640,
                height: container.clientHeight || 480,
                facingMode: currentFacingMode
            });
            await camera.start();
            startButton.disabled = true;
            stopButton.disabled = false;
            updateUI();
        }

        // Initialize variables
        let counter = 0;
        let stage = null; // 'down' (hinged, bell between the legs) or 'up' (hips snapped through, bell at chest height)
        let currentProgress = 0;
        let formWarning = null;
        let positionCue = null;
        let histories = {};
        const maxHistoryLength = 5;
        const SMOOTHING_WINDOW_MS = 160;
        const visibilityThreshold = 0.5;

        let pose = null;
        let camera = null;

        // Calculate angle between three points
        function calculateAngle(a, b, c) {
            // Landmark x and y are fractions of the frame's width and height. Rescale x by the
            // video's aspect ratio so angles are measured in true proportions on any camera.
            const aspect = (videoElement.videoWidth / videoElement.videoHeight) || 1;
            const radians = Math.atan2(c[1] - b[1], (c[0] - b[0]) * aspect) -
                Math.atan2(a[1] - b[1], (a[0] - b[0]) * aspect);
            let angle = Math.abs(radians * 180.0 / Math.PI);

            if (angle > 180.0) {
                angle = 360 - angle;
            }

            return angle;
        }

        // Check landmark visibility
        function checkLandmarkVisibility(landmarks, indices) {
            for (let idx of indices) {
                if (landmarks[idx].visibility < visibilityThreshold) {
                    return false;
                }
            }
            return true;
        }

        // Smooth angle using moving average
        function smoothAngle(value, history) {
            // Average the readings from the last ~160 ms (at most maxHistoryLength frames), so the
            // smoothing lag stays small on slower devices instead of growing with frame time.
            const now = performance.now();
            history.push({ t: now, v: value });
            while (history.length > maxHistoryLength ||
                   (history.length > 1 && now - history[0].t > SMOOTHING_WINDOW_MS)) {
                history.shift();
            }
            return history.reduce((sum, sample) => sum + sample.v, 0) / history.length;
        }

        // The skeleton is the only thing drawn over the video; it turns red while a form check fails
        function skeletonColor() {
            return document.querySelector('.camera-container').classList.contains('wrong-form') ? '#FF5C5C' : '#D7FF3A';
        }

        // ---- Body measurements ----
        // Landmark indices for each side of the body
        const LEFT = { name: 'left', ear: 7, shoulder: 11, elbow: 13, wrist: 15, hip: 23, knee: 25, ankle: 27, heel: 29, toe: 31 };
        const RIGHT = { name: 'right', ear: 8, shoulder: 12, elbow: 14, wrist: 16, hip: 24, knee: 26, ankle: 28, heel: 30, toe: 32 };

        function point(landmarks, idx) {
            return [landmarks[idx].x, landmarks[idx].y];
        }

        function clamp(value) {
            return Math.max(0, Math.min(100, value));
        }

        // The sides on which every listed joint is visible, clearest first
        function visibleSides(landmarks, joints) {
            return [LEFT, RIGHT]
                .filter(side => checkLandmarkVisibility(landmarks, joints.map(joint => side[joint])))
                .map(side => ({ side, score: joints.reduce((sum, joint) => sum + landmarks[side[joint]].visibility, 0) }))
                .sort((a, b) => b.score - a.score);
        }

        // The angle at joint b on one side
        function jointAngle(landmarks, side, a, b, c) {
            return calculateAngle(point(landmarks, side[a]), point(landmarks, side[b]), point(landmarks, side[c]));
        }

        // Smoothed reading, with its own history per measurement
        function smooth(key, value) {
            if (!histories[key]) histories[key] = [];
            return smoothAngle(value, histories[key]);
        }

        // Smoothed angle from the sides the camera can see: the two sides are averaged when they are
        // seen about equally well, otherwise the clearer side is trusted on its own
        function readAngle(landmarks, sides, a, b, c) {
            const used = sides.length > 1 && sides[0].score - sides[1].score < 0.3 ? sides : sides.slice(0, 1);
            const values = used.map(entry => smooth(`${a}-${b}-${c}-${entry.side.name}`, jointAngle(landmarks, entry.side, a, b, c)));
            return values.reduce((sum, value) => sum + value, 0) / values.length;
        }

        // Angle of the hip-to-shoulder line from vertical, in true proportions: 0 standing tall, 90 lying flat
        function torsoTilt(landmarks, side) {
            const aspect = (videoElement.videoWidth / videoElement.videoHeight) || 1;
            const dx = (landmarks[side.shoulder].x - landmarks[side.hip].x) * aspect;
            const dy = landmarks[side.shoulder].y - landmarks[side.hip].y;
            return Math.abs(Math.atan2(dx, -dy) * 180 / Math.PI);
        }

        // Torso tilt on the clearest side, or null when the shoulders and hips can't be seen
        function readTilt(landmarks) {
            const sides = visibleSides(landmarks, ['shoulder', 'hip']);
            return sides.length ? torsoTilt(landmarks, sides[0].side) : null;
        }

        // Red skeleton and an error cue while a form check fails
        function setFormWarning(message) {
            formWarning = message;
            document.querySelector('.camera-container').classList.toggle('wrong-form', !!message);
        }

        // How far the head and upper back curl down below the line of the torso, in degrees, on the clearest
        // side. A rounding back drops the ear below the hip-to-shoulder line; looking ahead lifts it above,
        // which doesn't count. Null while upright (there is no "down" to round towards) or out of view.
        function backRounding(landmarks) {
            const sides = visibleSides(landmarks, ['ear', 'shoulder', 'hip']);
            if (!sides.length) return null;
            const side = sides[0].side;
            if (torsoTilt(landmarks, side) < 30) return null;
            const aspect = (videoElement.videoWidth / videoElement.videoHeight) || 1;
            const vx = (landmarks[side.shoulder].x - landmarks[side.hip].x) * aspect;
            const vy = landmarks[side.shoulder].y - landmarks[side.hip].y;
            const wx = (landmarks[side.ear].x - landmarks[side.shoulder].x) * aspect;
            const wy = landmarks[side.ear].y - landmarks[side.shoulder].y;
            // Elevation of the torso and of the neck, both measured in the direction the torso points
            const facing = Math.sign(vx) || 1;
            const torso = Math.atan2(-vy, vx * facing);
            const neck = Math.atan2(-wy, wx * facing);
            return smooth('back-rounding', (torso - neck) * 180 / Math.PI);
        }

        // Update UI
        function updateUI() {
            repCountElement.textContent = counter;

            const progressBar = document.getElementById('repProgressBar');
            if (progressBar) {
                progressBar.style.height = `${currentProgress}%`;
            }

            let instructionText = '';
            let instructionClass = '';

            if (!pose || !camera) {
                instructionText = 'Click Start to begin';
                instructionClass = 'waiting';
            } else if (formWarning) {
                instructionText = formWarning;
                instructionClass = 'error';
            } else if (positionCue) {
                instructionText = positionCue;
                instructionClass = 'waiting';
            } else if (stage === 'down') {
                instructionText = 'SNAP YOUR HIPS FORWARD';
                instructionClass = 'action';
            } else if (stage === 'up') {
                instructionText = 'HINGE BACK DOWN';
                instructionClass = 'waiting';
            } else {
                instructionText = 'START: HINGE AND HIKE THE BELL';
                instructionClass = 'waiting';
            }

            instructionElement.textContent = instructionText;
            instructionElement.className = 'instruction-text ' + instructionClass;
        }

        // Process pose results
        function onResults(results) {
            if (!camera) return; // late frame from a stopped session
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            let warning = null;
            positionCue = null;
            if (results.poseLandmarks) {
                const landmarks = results.poseLandmarks;
                if (showSkeleton) {
                    drawConnectors(canvasCtx, landmarks, POSE_CONNECTIONS, { color: skeletonColor(), lineWidth: 4 });
                    drawLandmarks(canvasCtx, landmarks, { color: '#5CD3F5', lineWidth: 2, radius: 4 });
                }

                // Hip angle (shoulder–hip–knee), knee angle and arm height
                const trunk = visibleSides(landmarks, ['shoulder', 'hip', 'knee']);
                if (trunk.length > 0) {
                    const hip = readAngle(landmarks, trunk, 'shoulder', 'hip', 'knee');
                    const legs = visibleSides(landmarks, ['hip', 'knee', 'ankle']);
                    const knee = legs.length ? readAngle(landmarks, legs, 'hip', 'knee', 'ankle') : 180;
                    // Arm height: the angle between the torso and the arms (0 hanging, 90 straight out in front)
                    const arms = visibleSides(landmarks, ['hip', 'shoulder', 'elbow']);
                    const raise = arms.length ? readAngle(landmarks, arms, 'hip', 'shoulder', 'elbow') : 0;
                    currentProgress = clamp((hip - 110) / (165 - 110) * 100);

                    // Swing logic: down when hinged with the bell hiked back (hip angle < 110), up when the hips snap
                    // straight (> 165) with the knees locked (> 160) and the bell floated to chest height (arms more
                    // than 70° from the torso). A deadlift, with the arms hanging, never counts.
                    if (hip < 110) {
                        stage = 'down';
                    } else if (hip > 165 && knee > 160 && raise > 70 && stage === 'down') {
                        stage = 'up';
                        counter++;
                        window.dispatchEvent(new CustomEvent('repCompleted', { detail: { count: counter } }));
                    }

                    // Hinge, don't squat: the knees stay soft but never bend deeply
                    if (hip < 130 && knee < 120) {
                        warning = "HINGE, DON'T SQUAT";
                    }
                }

                // Straight arms: the hips swing the bell, the arms don't pull it
                const bent = visibleSides(landmarks, ['shoulder', 'elbow', 'wrist'])
                    .some(entry => smooth('arm-' + entry.side.name, jointAngle(landmarks, entry.side, 'shoulder', 'elbow', 'wrist')) < 120);
                if (!warning && bent) {
                    warning = 'KEEP YOUR ARMS STRAIGHT';
                }

                // Back straight: the head and upper back mustn't curl down more than 35° below the torso line
                const rounding = backRounding(landmarks);
                if (!warning && rounding !== null && rounding > 35) {
                    warning = 'KEEP YOUR BACK STRAIGHT';
                }
            }

            setFormWarning(warning);
            canvasCtx.restore();
            updateUI();
        }

        // Initialize MediaPipe Pose
        function initializePose() {
            pose = new Pose({
                locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
                }
            });

            pose.setOptions({
                modelComplexity: 1,
                smoothLandmarks: true,
                enableSegmentation: false,
                smoothSegmentation: false,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.7
            });

            pose.onResults(onResults);
        }

        // Start camera
        window.startCamera = function () {
            if (camera) {
                return;
            }

            // Reuse one Pose instance: MediaPipe cannot be re-created after close(),
            // so a new one would never return results. reset() clears the last set.
            if (pose) pose.reset();
            else initializePose();

            const container = document.querySelector('.camera-container');
            camera = new Camera(videoElement, {
                onFrame: async () => { await pose.send({ image: videoElement }); },
                width: container.clientWidth || 640,
                height: container.clientHeight || 480,
                facingMode: currentFacingMode
            });

            camera.start();
            updateMirror();
            startButton.disabled = true;
            stopButton.disabled = false;
            updateUI();
        };

        // Stop camera
        window.stopCamera = function () {
            if (camera) {
                camera.stop();
                camera = null;
            }

            counter = 0;
            stage = null;
            currentProgress = 0;
            formWarning = null;
            positionCue = null;
            histories = {};

            document.querySelector('.camera-container').classList.remove('wrong-form');

            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            videoElement.srcObject = null;

            startButton.disabled = false;
            stopButton.disabled = true;
            updateUI();
        };

        // Set canvas size
        function setupCanvas() {
            // Size the canvas to the camera frame itself. CSS scales and crops it exactly like the
            // video (both use object-fit: cover), so the skeleton lines up with the body.
            const updateCanvasSize = () => {
                if (videoElement.videoWidth) {
                    canvasElement.width = videoElement.videoWidth;
                    canvasElement.height = videoElement.videoHeight;
                } else {
                    const panel = document.querySelector('.camera-container');
                    if (panel) {
                        canvasElement.width = panel.clientWidth;
                        canvasElement.height = panel.clientHeight;
                    }
                }
            };

            updateCanvasSize();
            videoElement.addEventListener('loadedmetadata', updateCanvasSize);
            videoElement.addEventListener('resize', updateCanvasSize);
        }

        // Initialize
        setupCanvas();
        updateUI();

        // Handle page visibility change
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && camera) {
                window.stopCamera();
            }
        });
    </script>
    <script src="../assets/js/routine.js"></script>
</body>

</html>
