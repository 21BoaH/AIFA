# Builds the Android and iOS apps (Capacitor, in mobile/) from the same web code as the site.
#   Android: a debug APK you can install on any Android phone (download it from the run's artifacts).
#   iOS:     a simulator build, to prove the Xcode project compiles. Installing on an iPhone needs your
#            Apple signing team; see mobile/README.md.
name: Build mobile apps

on:
  push:
    branches: ["main"]
    paths: ["AIFitnessAsisstant/**", "mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["AIFitnessAsisstant/**", "mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install dependencies
        run: npm ci
      - name: Build the app's web content
        run: npm run build
      - name: Copy it into the Android project
        run: npx cap sync android
      - name: Build the APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-fitness-assistant-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS (simulator build)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build the app's web content
        run: npm run build
      - name: Copy it into the iOS project
        run: npx cap sync ios
      - name: Build for the iOS simulator
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package the simulator app
        working-directory: mobile/ios/App/build/Build/Products/Debug-iphonesimulator
        run: ditto -c -k --keepParent App.app "$GITHUB_WORKSPACE/ai-fitness-assistant-ios-simulator.zip"
      - name: Upload the simulator app
        uses: actions/upload-artifact@v4
        with:
          name: ai-fitness-assistant-ios-simulator
          path: ai-fitness-assistant-ios-simulator.zip
          if-no-files-found: error
